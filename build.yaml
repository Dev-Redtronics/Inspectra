# Inspectra's own build sources. Besides the defaults they list the files
# the secret scan should see and the files whose edits should rerun it:
# trivy-secret.yaml, the analysis and test configuration, and the CI
# workflows. Consumers of Inspectra are not affected by this section.
targets:
  $default:
    sources:
      - $package$
      - lib/**
      - bin/**
      - test/**
      - example/**
      - .github/**
      - pubspec.yaml
      - pubspec.lock
      - build.yaml
      - analysis_options.yaml
      - dart_test.yaml
      - trivy-secret.yaml
      - README.md
      - CHANGELOG.md

builders:
  format:
    import: "package:inspectra/builder.dart"
    builder_factories: ["formatBuilder"]
    build_extensions: {"$package$": ["inspectra/format.json"]}
    auto_apply: root_package
    build_to: cache
    # Runs after every builder that generates Dart code, so it checks the
    # package as the build leaves it.
    required_inputs: [".dart"]
  lint:
    import: "package:inspectra/builder.dart"
    builder_factories: ["lintBuilder"]
    build_extensions: {"$package$": ["inspectra/lint.json"]}
    auto_apply: root_package
    build_to: cache
    required_inputs: [".dart"]
  api:
    import: "package:inspectra/builder.dart"
    builder_factories: ["apiBuilder"]
    # The real output is "api.output" from the Inspectra configuration.
    build_extensions: {"$package$": ["api/package.api"]}
    auto_apply: root_package
    build_to: source
  secret_scan:
    import: "package:inspectra/builder.dart"
    builder_factories: ["secretScanBuilder"]
    build_extensions: {"$package$": ["inspectra/trivy/secret.json"]}
    auto_apply: root_package
    build_to: cache
  license_scan:
    import: "package:inspectra/builder.dart"
    builder_factories: ["licenseScanBuilder"]
    build_extensions: {"$package$": ["inspectra/trivy/license.json"]}
    auto_apply: root_package
    build_to: cache
  vulnerability_scan:
    import: "package:inspectra/builder.dart"
    builder_factories: ["vulnerabilityScanBuilder"]
    build_extensions: {"$package$": ["inspectra/trivy/vulnerability.json"]}
    auto_apply: root_package
    build_to: cache
