name: Feature request
description: Suggest a new capability, command or rule.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and why is it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, flag, configuration key or rule you have in mind.
    validations:
      required: true
