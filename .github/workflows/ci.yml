name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.13.4'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve dependencies
        run: dart pub get

      # Dogfooding: Inspectra provisions the Trivy its own integration tests run
      # against (checksum verified), instead of a third-party setup action. It
      # goes on PATH rather than into INSPECTRA_TRIVY, which would override the
      # fake Trivy executables the unit tests configure.
      - name: Provision Trivy with Inspectra
        if: runner.os != 'Windows'
        run: |
          dart run bin/inspectra.dart trivy --install --format json --output "$RUNNER_TEMP/trivy.json"
          dirname "$(jq -r .trivy.executable "$RUNNER_TEMP/trivy.json")" >> "$GITHUB_PATH"

      - name: Cache the Trivy database
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Verify (format, analyze, style, test)
        run: dart run tool/verify.dart

  inspectra:
    name: Inspectra on itself
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Cache the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Resolve dependencies
        run: dart pub get

      # The Trivy builders and the coverage run of the integration tests need
      # Trivy on PATH; INSPECTRA_TRIVY would override the unit tests' fakes.
      - name: Provision Trivy with Inspectra
        run: |
          dart run bin/inspectra.dart trivy --install --format json --output "$RUNNER_TEMP/trivy.json"
          dirname "$(jq -r .trivy.executable "$RUNNER_TEMP/trivy.json")" >> "$GITHUB_PATH"

      - name: build_runner --only-check
        run: dart run build_runner build --only-check

      # Format, lint, API dump, every Trivy scan (Trivy is provisioned by
      # Inspectra itself) and the 90 % coverage gate of pubspec.yaml.
      - name: inspectra check
        run: dart run inspectra check

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: .dart_tool/inspectra/trivy/
          retention-days: 30
          if-no-files-found: warn

  compile:
    name: Native executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Compile
        shell: bash
        run: |
          dart pub get
          mkdir -p build
          exe=build/inspectra
          if [ "$RUNNER_OS" = "Windows" ]; then exe=build/inspectra.exe; fi
          dart compile exe bin/inspectra.dart -o "$exe"
          "./$exe" --version
