name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Verify
        run: |
          dart pub get
          dart run tool/verify.dart

      - name: Tag matches the pubspec version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          test "v${version}" = "${GITHUB_REF_NAME}"

      # The release description is the section of the tagged version in
      # CHANGELOG.md; the release stops here when it is missing or empty.
      - name: Release notes
        shell: bash
        run: |
          dart run bin/inspectra.dart changelog check
          dart run bin/inspectra.dart changelog notes "${GITHUB_REF_NAME#v}" --output RELEASE_NOTES.md

      - name: Upload the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: inspectra
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: inspectra
          - os: macos-latest
            target: macos-arm64
            binary: inspectra
          - os: macos-13
            target: macos-x64
            binary: inspectra
          - os: windows-latest
            target: windows-x64
            binary: inspectra.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Compile
        shell: bash
        run: |
          dart pub get
          mkdir -p dist
          dart compile exe bin/inspectra.dart -o "dist/${{ matrix.binary }}"
          "./dist/${{ matrix.binary }}" --version
          cd dist
          7z a -tzip "../inspectra-${{ matrix.target }}.zip" "${{ matrix.binary }}" >/dev/null \
            || zip "../inspectra-${{ matrix.target }}.zip" "${{ matrix.binary }}"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspectra-${{ matrix.target }}
          path: inspectra-${{ matrix.target }}.zip
          retention-days: 7

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum inspectra-*.zip > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/inspectra-*.zip
            dist/checksums.txt
