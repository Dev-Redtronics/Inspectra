name: Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dogfood:
    name: Inspectra scans itself
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Resolve dependencies
        run: dart pub get

      # Reporting only; the verdict comes from the gate below, so that a newly disclosed advisory
      # never swallows the SARIF upload. Trivy is required: it is downloaded and verified by
      # Inspectra itself.
      - name: Scan (SARIF)
        run: >-
          dart run bin/inspectra.dart scan
          --trivy-mode required
          --format sarif --output inspectra.sarif
          --exit-zero

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: inspectra.sarif
          category: inspectra

      - name: Job summary
        if: always()
        run: dart run bin/inspectra.dart scan --format markdown --exit-zero >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on HIGH or CRITICAL findings
        run: dart run bin/inspectra.dart scan --fail-on high
