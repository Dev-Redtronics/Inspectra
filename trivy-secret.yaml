# Trivy secret scanning rules for this package.
# https://trivy.dev/latest/docs/scanner/secret/
#
# All of Trivy's built-in rules stay enabled; the rule below adds hard-coded
# credentials in Dart, which quotes strings with ' as often as with ".

disable-allow-rules:
  - usr-dirs

rules:
  - id: dart-hardcoded-credential
    category: Dart
    title: Hard-coded credential in Dart source
    severity: HIGH
    regex: (?i)(api_?key|token|secret|password)\s*=\s*['"](?P<secret>[A-Za-z0-9_/+\-]{8,})['"]
    secret-group-name: secret
    keywords:
      - apikey
      - api_key
      - token
      - secret
      - password
