name: inspectra
description: >-
  Enterprise-grade supply-chain security scanner for Dart and Flutter projects:
  OSV.dev vulnerability audit, package source inspection, trust and typosquat
  analysis, safe dependency installation, Git hooks and Trivy integration.
version: 1.0.0
repository: https://github.com/dev-redtronics/inspectra
issue_tracker: https://github.com/dev-redtronics/inspectra/issues
topics:
  - security
  - audit
  - vulnerability
  - supply-chain
  - cli

environment:
  sdk: ^3.11.0

executables:
  inspectra: inspectra

dependencies:
  archive: ^4.0.7
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

dev_dependencies:
  analyzer: ^14.0.0
  lints: ^6.1.0
  test: ^1.30.0
